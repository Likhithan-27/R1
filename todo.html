
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Interactive To-Do List application with CRUD operations and local storage.">

    <title>To-Do List | Likhitha</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <nav class="nav" aria-label="Primary navigation">
                <a class="logo" href="index.html">Likhitha</a>

                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="todo.html" aria-current="page">To-Do</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section class="section container" aria-labelledby="todo-title">

            <h1 id="todo-title">My To-Do List</h1>

            <p>
                Add, complete, edit, delete and filter your tasks.
                Your tasks are automatically saved in your browser.
            </p>

            <!-- Add Task Form -->
            <form id="todo-form" aria-label="Add a new task">

                <label for="todo-input">Task</label>

                <input
                    type="text"
                    id="todo-input"
                    name="task"
                    placeholder="Enter a task..."
                    required
                    autocomplete="off"
                >

                <button type="submit" id="add-task">
                    Add Task
                </button>

            </form>

            <!-- Filters -->
            <div class="todo-filters" aria-label="Task filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all">
                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="active">
                    Active
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed">
                    Completed
                </button>

            </div>

            <!-- Task List -->
            <section aria-labelledby="tasks-title">

                <h2 id="tasks-title">Tasks</h2>

                <ul
                    id="todo-list"
                    class="todo-list"
                    aria-live="polite">
                </ul>

                <p id="empty-message">
                    No tasks yet. Add your first task!
                </p>

            </section>

        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 Likhitha. Built for the JavaScript Logic &amp;
                State Management task.
            </p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="assets/js/script.js"></script>

</body>
</html>
